name: 💡 Feature Request
description: Suggest an idea or enhancement for SNSAS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve SNSAS? Let us know!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What would you like to see added?
      placeholder: Add support for sound volume control or additional display models...
    validations:
      required: true
  - type: textarea
    id: problem-solution
    attributes:
      label: Problem & Solution
      description: What problem does this solve and what is your proposed solution?
    validations:
      required: false

